<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - EventSphere</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
<div class="login-page">
    <div class="login-box">

        <h2>EventSphere</h2>
        <h3>Reset Password</h3>

        <p>Enter your registered email and recovery code.</p>

        {% if error %}
            <p style="color:red;">{{ error }}</p>
        {% endif %}

        <form method="POST">

            <input type="email"
                   name="email"
                   placeholder="Registered Email"
                   autocomplete="email"
                   required>

            <input type="text"
                   name="recovery_code"
                   placeholder="Recovery Code"
                   autocomplete="off"
                   required>

            <input type="password"
                   name="new_password"
                   placeholder="New Password"
                   minlength="8"
                   autocomplete="new-password"
                   required>

            <input type="password"
                   name="confirm_password"
                   placeholder="Confirm New Password"
                   autocomplete="new-password"
                   required>

            <p>
                Password must contain uppercase, lowercase,
                number and special character.
            </p>

            <button type="submit">
                Reset Password
            </button>

        </form>

        <p>
            <a href="{{ url_for('vendor_login') if account_type == 'vendor' else url_for('login') }}">
                Back to Login
            </a>
        </p>

    </div>
</div>
</body>
</html>
