<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose Login - EventSphere</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="login-page">

    <div class="login-box login-options-box">

        <h1>EventSphere</h1>
        <h2>Welcome Back</h2>

        <p class="login-text">
            Please select your account type to continue.
        </p>

        <div class="login-role-container">

            <a href="{{ url_for('login') }}"
               class="login-role-card">

                <div class="role-icon">👤</div>

                <h3>Customer</h3>

                <p>
                    Find and book event services.
                </p>

                <span class="role-login-btn">
                    Login as Customer
                </span>

            </a>


            <a href="{{ url_for('vendor_login') }}"
               class="login-role-card">

                <div class="role-icon">🏪</div>

                <h3>Vendor</h3>

                <p>
                    Manage your services and bookings.
                </p>

                <span class="role-login-btn">
                    Login as Vendor
                </span>

            </a>

        </div>

        <br>

        <a href="{{ url_for('home') }}">
            ← Back to Home
        </a>

    </div>

</div>

</body>
</html>
