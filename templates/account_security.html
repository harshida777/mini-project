<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Account Security - EventSphere</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="login-page">
    <div class="login-box">

        <h2>EventSphere</h2>
        <h3>Account Security</h3>

        <p>
            Verify your current password to generate
            a recovery code.
        </p>

        {% if error %}
            <p style="color:red;">{{ error }}</p>
        {% endif %}

        <form method="POST">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token }}">

            <label>Current Password</label>

            <input type="password"
                   name="current_password"
                   placeholder="Enter current password"
                   autocomplete="current-password"
                   required>

            <button type="submit">
                Generate Recovery Code
            </button>

        </form>

        <p>
            <a href="{{ url_for('vendor_profile') if account_type == 'vendor' else url_for('customer_profile') }}">
                Back to Profile
            </a>
        </p>

    </div>
</div>

</body>
</html>
