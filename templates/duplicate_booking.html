<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Duplicate Booking - EventSphere</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="login-page">

    <div class="login-box booking-unavailable-box">

        <h1>EventSphere</h1>

        <h2>Booking Already Exists</h2>

        <div class="unavailable-message">
            You already have a booking for this vendor on the selected date.
        </div>

        <p>
            Please choose another date or check your existing bookings.
        </p>

        <br>

        <a href="{{ url_for('dashboard') }}">
            ← View My Bookings
        </a>

        <br><br>

        <a href="{{ url_for('home') }}">
            ← Back to Home
        </a>

    </div>

</div>

</body>
</html>
