<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vendor Registration - EventSphere</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="login-page">

    <div class="login-box">

        {% if success %}

    <div class="success-message">
        ✅ {{ success }}
    </div>

    <br>

    <a href="{{ url_for('vendor_login') }}"
       class="vendor-logout-btn">
        Go to Vendor Login
    </a>

    <br><br>

    <a href="{{ url_for('home') }}">
        ← Back to Home
    </a>

{% else %}


        <p class="login-text">
            Register your business with EventSphere.
        </p>

        {% if error %}
            <p class="error-message">{{ error }}</p>
        {% endif %}

        <form method="POST"
              enctype="multipart/form-data">

            <div class="form-group">
                <label>Business Name</label>

                <input type="text"
                       name="business_name"
                       placeholder="Enter business name"
                       required>
            </div>

            <div class="form-group">
                <label>Email Address</label>

                <input type="email"
                       name="email"
                       placeholder="Enter email"
                       required>
            </div>

            <div class="form-group">

    <label>Phone Number</label>

    <div class="phone-input-group">

        <span>+91</span>

        <input type="text"
               name="phone"
               maxlength="10"
               minlength="10"
               pattern="[0-9]{10}"
               inputmode="numeric"
               placeholder="10 digit number"
               oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)"
               required>

    </div>

</div>

            <div class="form-group">
                <label>Password</label>

                <input type="password"
                       name="password"
                       placeholder="Enter password"
                       required>
            </div>

            <div class="form-group">
                <label>Upload Certificate / License</label>

                <input type="file"
                       name="certificate"
                       accept=".pdf,.jpg,.jpeg,.png"
                       required>
            </div>

            <button type="submit">
                Register as Vendor
            </button>

        </form>

        <p>
            Already registered?
            <a href="{{ url_for('vendor_login') }}">
    Vendor Login
</a>
        </p>

        <a href="{{ url_for('home') }}">
            ← Back to Home
        </a>
        {% endif %}

    </div>

</div>

</body>
</html>
