<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - EventSphere</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="login-page">

    <div class="login-box admin-dashboard-box">

        <h1>EventSphere</h1>

        <h2>Admin Dashboard</h2>

        <h3>Welcome, {{ admin_name }}</h3>

        <p>{{ admin_email }}</p>

        <br>

        <div class="admin-dashboard-actions">

    <a href="{{ url_for('admin_pending_vendors') }}"
       class="vendor-logout-btn">
        Pending Vendors
    </a>

    <a href="{{ url_for('admin_pending_customers') }}"
       class="vendor-logout-btn">
        Pending Customers
    </a>

    <a href="{{ url_for('admin_all_customers') }}"
       class="vendor-logout-btn">
        All Customers
    </a>

    <a href="{{ url_for('admin_all_vendors') }}"
       class="vendor-logout-btn">
        All Vendors
    </a>

    <a href="{{ url_for('admin_logout') }}"
       class="vendor-logout-btn">
        Logout
    </a>

</div>

        <br><br>

        <a href="{{ url_for('home') }}">
            ← Back to Home
        </a>

    </div>

</div>

</body>
</html>
