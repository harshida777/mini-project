<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vendor Login - EventSphere</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="login-page">

    <div class="login-box">

        <h1>EventSphere</h1>
        <h2>Vendor Login</h2>

        <p class="login-text">
            Login to manage your services and bookings.
        </p>

        {% if error %}
            <p class="error-message">
                {{ error }}
            </p>
        {% endif %}

        <form method="POST" autocomplete="off">

    <label>Email Address</label>
    <input type="email"
           name="email"
           autocomplete="off"
           required>

    <label>Password</label>
    <input type="password"
           name="password"
           autocomplete="new-password"
           required>

    <button type="submit">
        Vendor Login
    </button>

</form>
        <p style="text-align:center; margin-top:12px;">
            <a href="{{ url_for('forgot_password', account_type='vendor') }}">
                Forgot Password?
            </a>
        </p>

        <p>
            Don't have a vendor account?

            <a href="{{ url_for('vendor_register') }}">
                Register Here
            </a>
        </p>

        <a href="{{ url_for('home') }}">
            ← Back to Home
        </a>

    </div>

</div>

</body>
</html>
