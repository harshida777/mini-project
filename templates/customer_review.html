<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Write Review - EventSphere</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="login-page">

    <div class="login-box review-box">

        <h1>EventSphere</h1>

        {% if review %}
            <h2>Edit Review</h2>
        {% else %}
            <h2>Write Review</h2>
        {% endif %}

        <div class="review-booking-info">

            <p>
                <strong>Vendor:</strong>
                {{ booking.vendor_name }}
            </p>

            <p>
                <strong>Service:</strong>
                {{ booking.service_name }}
            </p>

            <p>
                <strong>Event Date:</strong>
                {{ booking.booking_date }}
            </p>

        </div>

        <form method="POST">

            <label>Your Rating</label>

            <div class="rating-options">

                {% for number in range(1, 6) %}

                    <label class="rating-item">

                        <input type="radio"
                               name="rating"
                               value="{{ number }}"
                               required

                               {% if review and review.rating == number %}
                                   checked
                               {% endif %}>

                        <span>
                            {{ number }} ⭐
                        </span>

                    </label>

                {% endfor %}

            </div>

            <label for="review_text">
                Your Review
            </label>

            <textarea
                id="review_text"
                name="review_text"
                rows="5"
                maxlength="1000"
                placeholder="Share your experience with this vendor..."
                required>{% if review %}{{ review.review_text }}{% endif %}</textarea>

            <button type="submit"
                    class="vendor-logout-btn">

                {% if review %}
                    Update Review
                {% else %}
                    Submit Review
                {% endif %}

            </button>

        </form>

        <br>

        <a href="{{ url_for('customer_profile') }}">
            ← Back to My Profile
        </a>

    </div>

</div>

</body>

</html>
