<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - EventSphere</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="login-page">

    <div class="login-box">

        <h1>EventSphere</h1>
        <h2>Admin Login</h2>

        <p>Login to manage EventSphere.</p>

        {% if error %}
            <div class="unavailable-message">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" autocomplete="off">

    <label>Email Address</label>

    <input type="email"
           name="email"
           autocomplete="off"
           required>

    <label>Password</label>

    <input type="password"
           name="password"
           autocomplete="new-password"
           required>

    <button type="submit">
        Admin Login
    </button>

</form>

        <br>

        <a href="{{ url_for('home') }}">
            ← Back to Home
        </a>

    </div>

</div>

</body>
</html>
